name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out game
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare playable files
        run: |
          mkdir _site
          cp index.html game.js styles.css encounter-integrated.css _site/
          cp tuner.html tuner-legacy.html tuner.css tuner-current.css _site/
          cp tuner.js tuner-current.js tuner-encounter.js encounter-tuning-data.js _site/
          cp simulator.html simulator.css simulator.js simulator-core.js simulator-worker.js _site/
          cp -R assets _site/

      - name: Upload game
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
